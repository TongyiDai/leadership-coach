<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <g font-family="PingFang SC, Source Han Sans SC, Arial, sans-serif">
    <text x="80" y="88" fill="#D8000F" font-size="26" font-weight="800" letter-spacing="2">领导力陪练</text>
    <text x="80" y="150" fill="#1C1410" font-size="52" font-weight="800">读真实发言，练到会</text>
    <text x="80" y="188" fill="#1C1410" font-size="18">照出盲点 · 给可落地动作 · 每周复盘看趋势</text>
    <rect x="80" y="208" width="120" height="6" fill="#D8000F"/>

    <!-- five-step band -->
    <g>
      <rect x="80"  y="300" width="180" height="150" fill="#F5F2EF" stroke="#1C1410" stroke-width="2"/>
      <rect x="290" y="300" width="180" height="150" fill="#F5F2EF" stroke="#1C1410" stroke-width="2"/>
      <rect x="500" y="300" width="200" height="150" fill="#1C1410" stroke="#1C1410" stroke-width="2"/>
      <rect x="730" y="300" width="180" height="150" fill="#F5F2EF" stroke="#1C1410" stroke-width="2"/>
      <rect x="940" y="300" width="180" height="150" fill="#F5F2EF" stroke="#1C1410" stroke-width="2"/>

      <text x="100" y="345" fill="#D8000F" font-size="30" font-weight="800">01</text>
      <text x="100" y="392" fill="#1C1410" font-size="24" font-weight="700">对齐</text>
      <text x="100" y="424" fill="#1C1410" font-size="14">方向·阶段·场景</text>

      <text x="310" y="345" fill="#D8000F" font-size="30" font-weight="800">02</text>
      <text x="310" y="392" fill="#1C1410" font-size="24" font-weight="700">取证</text>
      <text x="310" y="424" fill="#1C1410" font-size="14">会议发言为主</text>

      <text x="520" y="345" fill="#D8000F" font-size="30" font-weight="800">03</text>
      <text x="520" y="392" fill="#FFFFFF" font-size="24" font-weight="800">诊断</text>
      <text x="520" y="424" fill="#F5F2EF" font-size="14">框架归因·改进</text>

      <text x="750" y="345" fill="#D8000F" font-size="30" font-weight="800">04</text>
      <text x="750" y="392" fill="#1C1410" font-size="24" font-weight="700">陪练</text>
      <text x="750" y="424" fill="#1C1410" font-size="14">演练·教练</text>

      <text x="960" y="345" fill="#D8000F" font-size="30" font-weight="800">05</text>
      <text x="960" y="392" fill="#1C1410" font-size="24" font-weight="700">复盘</text>
      <text x="960" y="424" fill="#1C1410" font-size="14">每周·看趋势</text>

      <text x="272" y="390" fill="#D8000F" font-size="26" font-weight="800">›</text>
      <text x="482" y="390" fill="#D8000F" font-size="26" font-weight="800">›</text>
      <text x="712" y="390" fill="#D8000F" font-size="26" font-weight="800">›</text>
      <text x="922" y="390" fill="#D8000F" font-size="26" font-weight="800">›</text>
    </g>

    <!-- loop-back rule (red = active) -->
    <path d="M1030 450 L1030 520 L170 520 L170 456" fill="none" stroke="#D8000F" stroke-width="3" stroke-dasharray="9 7"/>
    <path d="M170 468 l-8 -16 l16 0 z" fill="#D8000F"/>
    <text x="600" y="560" text-anchor="middle" fill="#1C1410" font-size="16" font-weight="600">每周一 10:30 · 复盘上一周 · 再回看</text>

    <text x="80" y="640" fill="#1C1410" font-size="15">领导力 = 影响力：有下属代入团队，没下属代入协作方 / 上级 / 项目伙伴</text>
  </g>
</svg>

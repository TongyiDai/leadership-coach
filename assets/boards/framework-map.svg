<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <g font-family="PingFang SC, Source Han Sans SC, Arial, sans-serif">
    <text x="80" y="88" fill="#D8000F" font-size="26" font-weight="800" letter-spacing="2">诊断透镜</text>
    <text x="80" y="150" fill="#1C1410" font-size="52" font-weight="800">五个成熟框架</text>
    <text x="80" y="188" fill="#1C1410" font-size="18">不自创模型 · 按你选定的方向挑相关的用</text>
    <rect x="80" y="208" width="120" height="6" fill="#D8000F"/>

    <!-- four top panels -->
    <g>
      <rect x="80"  y="280" width="250" height="150" fill="#F5F2EF" stroke="#1C1410" stroke-width="2"/>
      <rect x="360" y="280" width="250" height="150" fill="#F5F2EF" stroke="#1C1410" stroke-width="2"/>
      <rect x="640" y="280" width="250" height="150" fill="#F5F2EF" stroke="#1C1410" stroke-width="2"/>
      <rect x="920" y="280" width="200" height="150" fill="#F5F2EF" stroke="#1C1410" stroke-width="2"/>

      <text x="100" y="330" fill="#1C1410" font-size="30" font-weight="800">GROW</text>
      <text x="100" y="366" fill="#D8000F" font-size="15" font-weight="700">对话结构</text>
      <text x="100" y="402" fill="#1C1410" font-size="15">目标·现状·选项·行动</text>

      <text x="380" y="330" fill="#1C1410" font-size="30" font-weight="800">SCARF</text>
      <text x="380" y="366" fill="#D8000F" font-size="15" font-weight="700">社交威胁/奖赏</text>
      <text x="380" y="402" fill="#1C1410" font-size="14">地位·确定·自主·归属·公平</text>

      <text x="660" y="326" fill="#1C1410" font-size="27" font-weight="800">Radical</text>
      <text x="660" y="356" fill="#1C1410" font-size="27" font-weight="800">Candor</text>
      <text x="660" y="392" fill="#D8000F" font-size="15" font-weight="700">反馈两维度</text>
      <text x="660" y="418" fill="#1C1410" font-size="14">真心关心×直接挑战</text>

      <text x="940" y="330" fill="#1C1410" font-size="28" font-weight="800">情境领导</text>
      <text x="940" y="366" fill="#D8000F" font-size="15" font-weight="700">按成熟度切换</text>
      <text x="940" y="402" fill="#1C1410" font-size="14">指令·教练·支持·授权</text>
    </g>

    <!-- SBI full-bleed red statement panel -->
    <rect x="80" y="470" width="1040" height="110" fill="#D8000F"/>
    <text x="110" y="520" fill="#FFFFFF" font-size="32" font-weight="800">SBI</text>
    <text x="110" y="556" fill="#FFFFFF" font-size="18">情境 · 行为 · 影响 —— 把反馈讲成可改的行为，不评判人</text>

    <text x="80" y="632" fill="#1C1410" font-size="15">无职权也适用：GROW 帮人想清楚 · SCARF 解释为何抵触 · Candor/SBI 给任何人反馈 · 情境领导判断要多少指导</text>
  </g>
</svg>

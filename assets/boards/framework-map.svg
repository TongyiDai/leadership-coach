    <text x="480" y="400" text-anchor="middle" fill="#999" font-size="13">地位·确定·自主·归属·公平</text>

    <circle cx="740" cy="300" r="70" fill="#fff" stroke="#2F6BFF" stroke-width="1.5"/>

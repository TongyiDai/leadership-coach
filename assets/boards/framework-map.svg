    <line x1="290" y1="300" x2="410" y2="300" stroke="#E0E0E0"/>
    <line x1="550" y1="300" x2="670" y2="300" stroke="#E0E0E0"/>
    <line x1="810" y1="300" x2="915" y2="300" stroke="#E0E0E0"/>

    <rect x="470" y="470" width="260" height="72" fill="#fff" stroke="#2F6BFF" stroke-width="1.5"/>
    <text x="600" y="502" text-anchor="middle" fill="#111" font-size="18" font-weight="600">SBI</text>

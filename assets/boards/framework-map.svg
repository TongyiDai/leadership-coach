    <text x="740" y="310" text-anchor="middle" fill="#111" font-size="18" font-weight="600">Candor</text>
    <text x="740" y="400" text-anchor="middle" fill="#999" font-size="13">真心关心×直接挑战</text>

    <circle cx="985" cy="300" r="70" fill="#fff" stroke="#222" stroke-width="1.2"/>
